name: wa-update

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'

permissions:
  contents: write # push the release commit and tag
  actions: write # dispatch publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wa-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          # PR code must not get the write token on disk
          persist-credentials: ${{ github.event_name != 'pull_request' }}
          # The changelog uses the last tag as the start of the commit range
          fetch-tags: true

      - name: Setup GIT
        run: |
          git config --global user.name "joaosouz4dev"
          git config --global user.email "47183663+joaosouz4dev@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1

      - name: Get npm cache directory
        id: npm-cache
        run: |
          echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
      - name: Setup npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fix husky
        run: chmod ug+x .husky/pre-commit

      - name: Check Updates
        id: update
        run: npm run wa-update
        env:
          WA_COMMIT: ${{ github.event_name != 'pull_request' }}

      - name: Git Status
        if: ${{ steps.update.outputs.hasChanges == 'true' }}
        run: git status

      - name: Remove untracked files
        if: ${{ steps.update.outputs.hasChanges == 'true' }}
        run: git clean -fd

      - name: Release
        if: ${{ steps.update.outputs.shouldRelease == 'true' && github.event_name != 'pull_request' }}
        run: npm run release -- --ci -i patch

      # Tags pushed with GITHUB_TOKEN don't fire `push: tags`; dispatch is exempt.
      - name: Trigger publish
        if: ${{ steps.update.outputs.shouldRelease == 'true' && github.event_name != 'pull_request' }}
        run: gh workflow run publish.yml --ref "v$(node -p "require('./package.json').version")"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Discord Notification (Outdated)
        uses: sarisia/actions-status-discord@v1
        if: ${{ steps.update.outputs.hasOutdated == 'true' && steps.update.outputs.shouldRelease == 'true' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          color: 0xCB2431
          title: Outdated WhatsApp WEB versions
          description: |
            Some versions of WhatsApp WEB doesn't work anymore.
            Outdated versions: `${{ join(fromJSON(steps.update.outputs.outdated), '`, `') }}`

      - name: Discord Notification (New)
        uses: sarisia/actions-status-discord@v1
        if: ${{ steps.update.outputs.hasNewVersion == 'true' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          color: 0x28A745
          title: New version for WhatsApp WEB!
          description: |
            A new version of WhatsApp WEB has just been released.
            Version Number: `${{ fromJSON(steps.update.outputs.version) }}`
